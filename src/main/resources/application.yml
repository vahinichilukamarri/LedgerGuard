spring:
  application:
    name: ledgerguard

  datasource:
    url: ${LEDGERGUARD_DB_URL:jdbc:postgresql://localhost:5432/ledgerguard}
    username: ${LEDGERGUARD_DB_USER:ledgerguard}
    password: ${LEDGERGUARD_DB_PASSWORD:ledgerguard}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks its mapping against it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: ${LEDGERGUARD_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for all in-sync replicas. An event the broker has not durably
      # accepted must not be marked published in the outbox.
      acks: all
      properties:
        # Fail fast when the broker is unreachable instead of blocking the
        # publisher thread. The rows simply stay unpublished and get retried.
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: ${LEDGERGUARD_KAFKA_GROUP:ledgerguard-ledger-events}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    admin:
      # The app must start even when Kafka is down; the outbox is what makes
      # that safe. Topics are created once the broker appears.
      fail-fast: false
      auto-create: true

ledgerguard:
  outbox:
    publisher:
      enabled: true
      poll-interval-ms: 1000
      batch-size: 100
      send-timeout-seconds: 10
  kafka:
    consumer-group: ${LEDGERGUARD_KAFKA_GROUP:ledgerguard-ledger-events}
  explanation:
    llm:
      # The narrative layer. Off unless an API key is supplied: with no key
      # every narrative comes from Phase 10's deterministic templates, which is
      # a supported way to run this system and the way the tests run it.
      #
      # The key comes from the environment and is never written here. See
      # .env.example; .env is gitignored.
      enabled: ${LEDGERGUARD_LLM_ENABLED:true}
      api-key: ${LEDGERGUARD_GROQ_API_KEY:}
      base-url: ${LEDGERGUARD_GROQ_BASE_URL:https://api.groq.com/openai/v1}
      # Configuration rather than a constant in code: hosted catalogues change
      # names and swap weights behind a stable id. See LLM_EXPLANATION_REPORT.md
      # for why the small model is the default for this task.
      model: ${LEDGERGUARD_GROQ_MODEL:llama-3.1-8b-instant}
      temperature: 0.0
      max-tokens: 400
      # Short, because this sits on a read endpoint and a slow narrative is
      # worth less than a fast template.
      connect-timeout-ms: 1500
      timeout-ms: 4000
      max-attempts: 2
      retry-backoff-ms: 200
      failure-threshold: 3
      cooldown-seconds: 60
      cache-size: 500

server:
  port: ${LEDGERGUARD_PORT:8080}

logging:
  level:
    com.ledgerguard: INFO
    org.apache.kafka.clients.NetworkClient: ERROR
