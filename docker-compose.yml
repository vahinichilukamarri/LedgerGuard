services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerguard-postgres
    environment:
      POSTGRES_DB: ledgerguard
      POSTGRES_USER: ledgerguard
      POSTGRES_PASSWORD: ledgerguard
    ports:
      - "5432:5432"
    volumes:
      - ledgerguard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerguard -d ledgerguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledgerguard-pgdata:
